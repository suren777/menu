name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run isort --check-only .
      - run: uv run mypy menu tests
      - run: uv run pytest
