name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # ephemeral Postgres per run via testcontainers; never a shared DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy menu tests
      - run: uv run pytest --cov=menu --cov-fail-under=85
