[project]
name = "menu"
version = "0.1.0"
description = "Recipe sourcing lab: discover, fetch and extract recipes. Code graduates to food-guru's ingest."
authors = [{ name = "Suren Islyaev" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "inflect>=7.5.0",
    "ingredient-parser-nlp>=2.8.0",
    "pydantic>=2.5",
    "requests>=2.31",
    "sqlalchemy>=2.0.22",
]

[project.scripts]
menu-ingest = "menu.ingest.pipeline:main"

[dependency-groups]
dev = [
    "black>=24.1",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=4.5.1",
    "pytest>=7.2",
    "ruff>=0.4",
    "types-defusedxml>=0.1",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["menu"]

[tool.pytest]
addopts = ["-ra", "-q"]
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]

[tool.black]
target-version = ["py314"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "ARG", # flake8-unused-arguments
    "PTH", # use pathlib instead of os
    "BLE", # blind except Exception
    "PT",  # pytest style
    "S",   # security (bandit)
    "TC",  # typing-only imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is the point of tests

[tool.mypy]
python_version = "3.14"
strict = true
