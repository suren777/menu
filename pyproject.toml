[project]
name = "menu"
version = "0.1.0"
description = "Recipe sourcing lab: discover, fetch and extract recipes. Code graduates to food-guru's ingest."
authors = [{ name = "Suren Islyaev" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "pydantic>=2.5",
    "requests>=2.31",
    "sqlalchemy>=2.0.22",
]

[dependency-groups]
dev = [
    "black>=24.1",
    "isort>=5.13",
    "mypy>=1.8",
    "pytest>=7.2",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.4",
    "types-defusedxml>=0.1",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["menu"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
target-version = ["py314"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "ARG", # flake8-unused-arguments
    "PTH", # use pathlib instead of os
]

[tool.mypy]
python_version = "3.14"
strict = true
